[tasks.help]
description = "Show the repeatable project workflows"
run = "printf '%s\\n' 'mise run idf-check      Verify ESP-IDF and idf.py' 'mise run test            Run canonical host tests' 'mise run target-build   Build target Unity image' 'mise run target-test    Flash target image and run hardware Unity tests (ESP_PORT=...)' 'mise run firmware-build Build normal firmware' 'mise run allboards-test Discover, flash, capture, and analyze all ACM boards' 'mise run check          Run host tests before target and firmware builds'"

[tasks.test]
description = "Run canonical host tests"
run = "./scripts/host-test.sh"

[tasks.idf-check]
description = "Verify the configured ESP-IDF checkout and idf.py"
run = "./scripts/idf-check.sh"

[tasks.target-build]
description = "Build the target Unity image"
run = "./scripts/target-build.sh"

[tasks.target-test]
description = "Flash the target image and run hardware Unity tests"
run = "./scripts/target-test.sh"

[tasks.firmware-build]
description = "Build the normal firmware"
run = "./scripts/firmware-build.sh"

[tasks.allboards-test]
description = "Discover, flash, capture, and analyze all ACM boards"
run = "./TEST-e2e/allboards/run.sh"

[tasks.check]
description = "Run host tests before target and firmware builds"
depends = ["test"]
run = ["mise run target-build", "mise run firmware-build"]
